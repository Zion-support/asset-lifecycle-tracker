<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Asset Lifecycle Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:120px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>💻 Asset Lifecycle Tracker</h1><p>Plan your hardware refresh budget.</p><label>Devices: <input id="d" type="number" value="200"></label> <label>Avg age (years): <input id="a" type="number" value="4"></label> <label>Avg cost ($): <input id="c" type="number" value="1200"></label> <button onclick="go()">Forecast</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const due=Math.round(g('d')*Math.min(1,g('a')/5));document.getElementById('out').textContent=`Devices past/near refresh (5-yr cycle): ${due}\nRefresh budget needed: $${(due*g('c')).toLocaleString()}\nEOSL risk: ${g('a')>=5?'🔴 HIGH — extended support or replacement required':g('a')>=4?'🟡 Plan refresh within 12 months':'🟢 Healthy fleet age'}\n\nFull lifecycle tracking with warranty alerts: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/asset-lifecycle-tracker">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-warranty-tracker/">Warranty Tracker</a></p></body></html>
